{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}InfoTrip — Descubre Jalisco con información real{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #FDFCFA;
      --bg-soft:   #F7F3EE;
      --primary:   #6741D9;
      --primary-h: #5835C4;
      --accent:    #F76707;
      --accent-h:  #E05A00;
      --ink:       #1F1635;
      --muted:     #9B8FAF;
      --border:    #E8E0F5;
      --tag-bg:    #F3EFFF;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-soft); color: var(--ink); }
  </style>
  {% block extra_css %}{% endblock %}
  <link rel="stylesheet" href="{% static 'css/chatbot.css' %}">
</head>
<body>
{% block content %}{% endblock %}
{% include 'partials/chatbot.html' %}
{% block extra_js %}{% endblock %}
<script src="{% static 'js/chatbot.js' %}" defer></script>
</body>
</html>
