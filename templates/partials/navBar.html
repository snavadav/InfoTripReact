{% load static %}
<style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FDFCFA;
      --bg-soft:   #F7F3EE;
      --primary:   #6741D9;
      --primary-h: #5835C4;
      --accent:    #F76707;
      --accent-h:  #E05A00;
      --ink:       #1F1635;
      --muted:     #9B8FAF;
      --border:    #E8E0F5;
      --tag-bg:    #F3EFFF;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-soft);
      min-height: 100vh;
    }

    #navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(253, 252, 250, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: box-shadow .3s, border-color .3s;
    }
    #navbar.scrolled {
      box-shadow: 0 4px 32px rgba(103,65,217,.1), 0 1px 4px rgba(103,65,217,.04);
      border-color: rgba(232, 224, 245, 0.7);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -1px;
      flex-shrink: 0;
    }
    .logo span { color: var(--accent); }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: .15rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
      padding: .5rem .85rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: color .2s, background .2s;
    }
    .nav-links a:hover {
      color: var(--primary);
      background: var(--tag-bg);
    }
    .nav-links a svg {
      width: 15px; height: 15px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      flex-shrink: 0;
    }

    /* ── Acciones ── */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-shrink: 0;
    }
    .btn-ghost {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--ink);
      font-family: inherit;
      font-size: .875rem;
      font-weight: 600;
      padding: .5rem 1.1rem;
      border-radius: 2rem;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .2s, color .2s;
    }
    .btn-ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #E05A00);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: .875rem;
      font-weight: 700;
      padding: .55rem 1.3rem;
      border-radius: 2rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 14px rgba(247,103,7,.28);
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent-h), #c94e00);
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(247,103,7,.4);
    }
    .btn-primary:active {
      transform: scale(0.97);
    }

    .nav-divider {
      width: 1px; height: 22px;
      background: var(--border);
    }

    /* ── Usuario autenticado ── */
    .nav-user-wrap {
      display: none;
      align-items: center;
      gap: .75rem;
    }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #8B5CF6);
      color: #fff;
      font-size: .82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 2px solid white;
      box-shadow: 0 2px 10px rgba(103, 65, 217, 0.3);
    }
    .user-name {
      font-size: .875rem;
      font-weight: 600;
      color: var(--ink);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-logout {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: .8rem;
      font-weight: 600;
      padding: .4rem .9rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-logout:hover {
      border-color: #D94141;
      color: #D94141;
    }

    /* ── Hamburger ── */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: .4rem;
    }
    .hamburger span {
      display: block;
      width: 22px; height: 2px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ── Menú móvil ── */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 66px; left: 0; right: 0;
      background: rgba(253, 252, 250, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem 1.5rem;
      flex-direction: column;
      gap: .2rem;
      z-index: 99;
      box-shadow: 0 16px 48px rgba(103,65,217,.1);
    }
    .mobile-menu.open {
      display: flex;
      animation: mobileMenuSlide .2s ease;
    }
    @keyframes mobileMenuSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .mobile-menu a {
      color: var(--muted);
      text-decoration: none;
      font-size: .925rem;
      font-weight: 500;
      padding: .7rem .85rem;
      border-radius: .75rem;
      display: flex; align-items: center; gap: .5rem;
      transition: background .2s, color .2s;
    }
    .mobile-menu a svg {
      width: 16px; height: 16px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      flex-shrink: 0;
    }
    .mobile-menu a:hover {
      background: var(--tag-bg);
      color: var(--primary);
    }
    .mobile-menu .sep {
      height: 1px;
      background: var(--border);
      margin: .5rem 0;
    }
    .mobile-menu .btn-primary {
      border-radius: .75rem;
      justify-content: center;
      padding: .85rem;
      margin-top: .25rem;
      text-align: center;
    }

    /* Usuario móvil */
    .mobile-user-info {
      display: none;
      align-items: center;
      gap: .75rem;
      padding: .7rem .85rem;
    }
    .mobile-user-info .user-avatar {
      width: 38px; height: 38px;
      font-size: .9rem;
    }
    .mobile-user-info .user-name {
      font-size: .925rem;
      font-weight: 600;
      color: var(--ink);
    }

    @media (max-width: 768px) {
      .nav-links, .nav-actions { display: none; }
      .hamburger { display: flex; }
    }
  
</style>

<nav id="navbar">
  <div class="nav-inner">

    <a href="/" class="logo">Info<span>Trip</span></a>

    <ul class="nav-links">
      <li><a href="/mis-viajes/" data-trip-label>Planear escapada</a></li><li data-session-only hidden><a href="/favoritos/">Favoritos</a></li>
      <li>
        <a href="/destinos/">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Destinos
        </a>
      </li>
      <li>
        <a href="/destinos/">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Explorar
        </a>
      </li>


    </ul>

    <div class="nav-actions">

      <!-- No autenticado -->
      <div id="nav-guest" style="display:flex;align-items:center;gap:.75rem;">
        <a href="/login/" class="btn-ghost">Iniciar sesión</a>
        <div class="nav-divider"></div>
        <a href="/registro/" class="btn-primary">Registrarse gratis</a>
      </div>

      <!-- Autenticado -->
      <div class="nav-user-wrap" id="nav-user">
        <div class="user-avatar" id="userAvatar"></div>
        <span class="user-name" id="userName"></span>
        <div class="nav-divider"></div>
        <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
      </div>

    </div>

    <button class="hamburger" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Menú móvil -->
<div class="mobile-menu" id="mobileMenu">
  <a href="/mis-viajes/" data-trip-label>Planear escapada</a><a href="/favoritos/" data-session-only hidden>Favoritos</a>

  <!-- Info usuario móvil (autenticado) -->
  <div class="mobile-user-info" id="mobileUserInfo">
    <div class="user-avatar" id="mobileUserAvatar"></div>
    <span class="user-name" id="mobileUserName"></span>
  </div>

  <a href="/destinos/">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    Destinos
  </a>
  <a href="/destinos/">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Explorar
  </a>



  <div class="sep"></div>

  <!-- No autenticado móvil -->
  <div id="mobile-guest">
    <a href="/login/">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Iniciar sesión
    </a>
    <a href="/registro/" class="btn-primary">Registrarse gratis</a>
  </div>

  <!-- Autenticado móvil -->
  <div id="mobile-auth" style="display:none;"><a href="/perfil/">Mi perfil y aportes</a>
    <a href="#" id="mobileLogoutBtn">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </a>
  </div>

</div>

<script>
  // ── Scroll shadow ──
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });

  // ── Hamburger ──
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });
  mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
    });
  });

  // ── Sesión ──
  let usuario = null;
  try {usuario = JSON.parse(localStorage.getItem('usuario') || 'null');} catch {}
  if (!usuario || typeof usuario.nombre !== 'string' || typeof usuario.apellido !== 'string' || !localStorage.getItem('access_token')) usuario = null;

  if (usuario) {
    const inicial = usuario.nombre.charAt(0).toUpperCase();
    const nombreCompleto = usuario.nombre + ' ' + usuario.apellido;

    // Desktop
    document.getElementById('nav-guest').style.display = 'none';
    const navUser = document.getElementById('nav-user');
    navUser.style.display = 'flex';
    document.getElementById('userAvatar').textContent = inicial;
    document.getElementById('userName').textContent   = nombreCompleto;

    // Móvil
    const mobileUserInfo = document.getElementById('mobileUserInfo');
    mobileUserInfo.style.display = 'flex';
    document.getElementById('mobileUserAvatar').textContent = inicial;
    document.getElementById('mobileUserName').textContent   = nombreCompleto;
    document.getElementById('mobile-guest').style.display   = 'none';
    document.getElementById('mobile-auth').style.display    = 'block';
  }

  const profileLink = document.createElement('a');
  profileLink.href = '/perfil/'; profileLink.textContent = 'Mi perfil';
  document.getElementById('nav-user').prepend(profileLink);

  // ── Logout ──
  function doLogout() {
    const refresh = localStorage.getItem('refresh_token');
    fetch('/api/v1/auth/logout/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('access_token'), 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({ refresh })
    }).finally(() => {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      localStorage.removeItem('usuario');
      window.location.href = '/';
    });
  }

  document.getElementById('logoutBtn')?.addEventListener('click', doLogout);
  document.getElementById('mobileLogoutBtn')?.addEventListener('click', doLogout);

  // ── CSRF ──
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
</script>

<style>[data-session-only][hidden] { display: none !important; }</style>
<script src="{% static 'js/session-ui.js' %}" defer></script>
