<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfoTrip — Navbar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FDFCFA;
      --bg-soft:   #F7F3EE;
      --primary:   #6741D9;
      --primary-h: #5835C4;
      --accent:    #F76707;
      --accent-h:  #E05A00;
      --ink:       #1F1635;
      --muted:     #9B8FAF;
      --border:    #E8E0F5;
      --tag-bg:    #F3EFFF;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-soft);
      min-height: 200vh;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1.5px solid var(--border);
      transition: box-shadow .3s;
    }
    nav.scrolled {
      box-shadow: 0 4px 24px rgba(103,65,217,.08);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -1px;
      flex-shrink: 0;
    }
    .logo span { color: var(--accent); }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: .15rem;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
      padding: .5rem .85rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: color .2s, background .2s;
    }
    .nav-links a:hover {
      color: var(--primary);
      background: var(--tag-bg);
    }
    .nav-links a svg {
      width: 15px; height: 15px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      flex-shrink: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-shrink: 0;
    }
    .btn-ghost {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--ink);
      font-family: inherit;
      font-size: .875rem;
      font-weight: 600;
      padding: .5rem 1.1rem;
      border-radius: 2rem;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .2s, color .2s;
    }
    .btn-ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: .875rem;
      font-weight: 700;
      padding: .55rem 1.25rem;
      border-radius: 2rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 12px rgba(247,103,7,.25);
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-primary:hover {
      background: var(--accent-h);
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(247,103,7,.35);
    }

    .nav-divider {
      width: 1px; height: 22px;
      background: var(--border);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: .4rem;
    }
    .hamburger span {
      display: block;
      width: 22px; height: 2px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      display: none;
      position: fixed;
      top: 66px; left: 0; right: 0;
      background: var(--bg);
      border-bottom: 1.5px solid var(--border);
      padding: 1rem 1.5rem 1.5rem;
      flex-direction: column;
      gap: .2rem;
      z-index: 99;
      box-shadow: 0 8px 24px rgba(103,65,217,.07);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      color: var(--muted);
      text-decoration: none;
      font-size: .925rem;
      font-weight: 500;
      padding: .7rem .85rem;
      border-radius: .75rem;
      display: flex; align-items: center; gap: .5rem;
      transition: background .2s, color .2s;
    }
    .mobile-menu a svg {
      width: 16px; height: 16px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      flex-shrink: 0;
    }
    .mobile-menu a:hover {
      background: var(--tag-bg);
      color: var(--primary);
    }
    .mobile-menu .sep {
      height: 1px;
      background: var(--border);
      margin: .5rem 0;
    }
    .mobile-menu .btn-primary {
      border-radius: .75rem;
      justify-content: center;
      padding: .85rem;
      margin-top: .25rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      .nav-links, .nav-actions { display: none; }
      .hamburger { display: flex; }
    }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">

    <a href="/" class="logo">Info<span>Trip</span></a>

    <ul class="nav-links">
      <li>
        <a href="#destinos">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Destinos
        </a>
      </li>
      <li>
        <a href="#explorar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Explorar
        </a>
      </li>
      <li>
        <a href="#resenas">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Reseñas
        </a>
      </li>
      <li>
        <a href="#comunidad">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Comunidad
        </a>
      </li>
    </ul>

    <div class="nav-actions">
      <a href="/login" class="btn-ghost">Iniciar sesión</a>
      <div class="nav-divider"></div>
      <a href="/registro" class="btn-primary">Registrarse gratis</a>
    </div>

    <button class="hamburger" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="#destinos">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    Destinos
  </a>
  <a href="#explorar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Explorar
  </a>
  <a href="#resenas">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    Reseñas
  </a>
  <a href="#comunidad">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Comunidad
  </a>
  <div class="sep"></div>
  <a href="/login">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Iniciar sesión
  </a>
  <a href="/registro" class="btn-primary">Registrarse gratis</a>
</div>

<script>
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
  });

  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });

  mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
    });
  });
</script>

</body>
</html>
