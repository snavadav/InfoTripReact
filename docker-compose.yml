# InfoTrip completo: nginx → gunicorn (Django) + PostgreSQL 16 + Redis, y el envío de avisos por correo.
# Uso:  cp .env.docker.example .env.docker  (y edita los valores)
#       docker compose --env-file .env.docker up --build
# La aplicación queda en http://localhost:8080. Detalles en el README (sección Docker).

x-app: &app
  build: .
  image: infotrip:local
  env_file: .env.docker
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16
    env_file: .env.docker
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Deja el volumen `media` en manos del usuario de la aplicación, sea cual sea el contenedor que lo
  # haya creado o lo que se haya restaurado en él. Sin esto, subir fotos falla con "Permission denied".
  permisos-media:
    build: .
    image: infotrip:local
    user: root
    entrypoint: ["chown", "-R", "infotrip", "/app/media"]
    env_file: .env.docker
    volumes:
      - media:/app/media
    restart: "no"

  web:
    <<: *app
    # Las migraciones se aplican al arrancar; con varias réplicas, ejecútalas aparte una sola vez.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn infotrip.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      permisos-media:
        condition: service_completed_successfully
    volumes:
      - media:/app/media
    healthcheck:
      # /health/ comprueba base de datos y caché; el Host debe estar en ALLOWED_HOSTS.
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0]}), timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3

  avisos:
    <<: *app
    # Espera a `web` para que las migraciones ya estén aplicadas.
    depends_on:
      web:
        condition: service_healthy
    # Envía los avisos pendientes cada 5 minutos y borra los tokens caducados una vez al día.
    command: >-
      sh -c "n=0; while true; do python manage.py enviar_avisos;
      [ $$((n % 288)) -eq 0 ] && python manage.py flushexpiredtokens;
      n=$$((n + 1)); sleep 300; done"

  respaldos:
    image: postgres:16
    env_file: .env.docker
    # Copia diaria de la base y las fotos; restauración en docs/operacion.md.
    entrypoint: ["sh", "/respaldo.sh"]
    volumes:
      - ./docker/respaldo.sh:/respaldo.sh:ro
      - media:/media:ro
      - respaldos:/respaldos
    # Espera a `web` para que las migraciones ya estén aplicadas.
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.28
    ports:
      # Cambia el puerto con INFOTRIP_PUERTO en .env.docker si el 8080 está ocupado.
      - "${INFOTRIP_PUERTO:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  media:
  respaldos:
