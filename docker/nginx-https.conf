# Igual que nginx.conf, pero detrás de Caddy (docker-compose.aws.yml), que termina HTTPS.
# Django recibe la IP real y el esquema que fijó Caddy. nginx no publica puertos: solo Caddy lo alcanza.
server {
    listen 80;
    server_tokens off;
    # Las imágenes admiten hasta 5 MB (apps/core/imagenes.py) más el resto del formulario.
    client_max_body_size 6m;

    location /media/ {
        alias /srv/media/;
        # Son JPEG recodificados por Django; aun así no se interpretan como otro tipo ni ejecutan nada.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        expires 7d;
    }

    location / {
        # Con una variable, nginx resuelve el nombre en cada momento (DNS de Docker) en lugar de
        # guardar la IP al arrancar; si `web` se recrea con otra IP, sigue llegando a él.
        resolver 127.0.0.11 valid=10s;
        set $aplicacion http://web:8000;
        proxy_pass $aplicacion;
        proxy_set_header Host $http_host;
        # Caddy ya puso aquí solo la IP del visitante; se pasa sin añadir la de Caddy. NUM_PROXIES=1.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # https, fijado por Caddy; con $scheme Django creería que es HTTP y rechazaría el CSRF.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
