# Igual que nginx.conf, pero detrás de Caddy (docker-compose.aws.yml), que termina HTTPS.
# Django recibe la IP real y el esquema que fijó Caddy. nginx no publica puertos: solo Caddy lo alcanza.
# Registro de accesos sin la cadena de consulta ni el origen: no deben quedar búsquedas de direcciones (?q=),
# coordenadas (?lat=&lon=) ni enlaces con token (?t=).
log_format sin_consulta '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    access_log /var/log/nginx/access.log sin_consulta;
    listen 80;
    server_tokens off;
    # Las imágenes admiten hasta 5 MB (apps/core/imagenes.py) más el resto del formulario.
    client_max_body_size 6m;

    location /media/ {
        alias /srv/media/;
        # Son JPEG recodificados por Django; aun así no se interpretan como otro tipo ni ejecutan nada.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        expires 7d;
    }

    # Fotos del pasaporte: son privadas y Django las sirve solo a quien puede verlas (apps/comunidad/pasaporte.py).
    location /media/pasaporte/ {
        return 404;
    }

    # /sw.js y /manifest.webmanifest también van a Django (apps/core/pwa.py), que fija su Content-Type y
    # "Cache-Control: no-cache" para el service worker. nginx no guarda respuestas (no hay proxy_cache) y
    # las pasa tal cual; así cada despliegue llega a los navegadores. La CI lo comprueba (test_pwa).
    location / {
        # Con una variable, nginx resuelve el nombre en cada momento (DNS de Docker) en lugar de
        # guardar la IP al arrancar; si `web` se recrea con otra IP, sigue llegando a él.
        resolver 127.0.0.11 valid=10s;
        set $aplicacion http://web:8000;
        proxy_pass $aplicacion;
        proxy_set_header Host $http_host;
        # Caddy ya puso aquí solo la IP del visitante; se pasa sin añadir la de Caddy. NUM_PROXIES=1.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # https, fijado por Caddy; con $scheme Django creería que es HTTP y rechazaría el CSRF.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
