name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  calidad:
    name: Lint y auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  pruebas:
    name: Pruebas (PostgreSQL 16 y Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: infotrip
          POSTGRES_PASSWORD: infotrip
          POSTGRES_DB: infotrip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U infotrip"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: infotrip
      DB_USER: infotrip
      DB_PASSWORD: infotrip
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run --settings=infotrip.settings.test_postgres

      - name: Migraciones aplicables sobre PostgreSQL
        run: python manage.py migrate --noinput --settings=infotrip.settings.test_postgres

      - name: Pruebas con cobertura (PostgreSQL + Redis)
        run: |
          coverage run manage.py test --settings=infotrip.settings.test_postgres
          coverage report

      - name: Pruebas en SQLite (configuración local)
        run: python manage.py test --settings=infotrip.settings.test
        env:
          REDIS_URL: ''

      - name: check --deploy con la configuración de producción
        run: python manage.py check --deploy --fail-level WARNING --settings=infotrip.settings.prod
        env:
          SECRET_KEY: ci-${{ github.run_id }}-clave-de-prueba-solo-para-check-deploy-no-secreta
          ALLOWED_HOSTS: infotrip.example.mx

  navegador:
    name: Pruebas de navegador (Playwright)
    runs-on: ubuntu-latest
    env:
      E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Instalar Chromium
        run: playwright install --with-deps chromium
      - name: Flujos reales en el navegador
        run: python manage.py test e2e --settings=infotrip.settings.test

  docker:
    name: Imagen Docker y despliegue con compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuración de prueba (valores aleatorios, solo para esta ejecución)
        run: |
          clave=$(python3 -c "import secrets; print(secrets.token_urlsafe(60))")
          contrasena=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          sed -e "s|^SECRET_KEY=.*|SECRET_KEY=$clave|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$contrasena|" \
              -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$contrasena|" .env.docker.example > .env.docker
          # Solo la tarea del DENUE, que sin clave se salta: CI no debe descargar OpenStreetMap.
          echo "TAREAS_PROGRAMADAS=denue" >> .env.docker
      - name: Construir y levantar
        run: docker compose --env-file .env.docker up --build --detach --wait --wait-timeout 180
      - name: Comprobar a través de nginx
        run: |
          curl --fail --silent --show-error http://localhost:8080/health/
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/destinos/
          estatico=$(curl --fail --silent http://localhost:8080/destinos/ | grep -o '/static/css/[^"]*' | head -1)
          curl --fail --silent --show-error --output /dev/null "http://localhost:8080$estatico"
          curl --fail --silent --show-error --head http://localhost:8080/ | grep -i '^content-security-policy'
      - name: test_pwa (service worker, manifiesto y página sin conexión a través de nginx)
        run: |
          set -o pipefail
          sw=$(curl --fail --silent --show-error --head http://localhost:8080/sw.js)
          echo "$sw" | grep -i '^content-type: text/javascript'
          echo "$sw" | grep -i '^cache-control: no-cache'
          curl --fail --silent --show-error --head http://localhost:8080/manifest.webmanifest | grep -i '^content-type: application/manifest+json'
          # Los íconos del manifiesto existen con su nombre con hash de collectstatic.
          iconos=$(curl --fail --silent http://localhost:8080/manifest.webmanifest | grep -o '/static/images/app/[^"]*')
          test -n "$iconos"
          for icono in $iconos; do curl --fail --silent --show-error --output /dev/null "http://localhost:8080$icono"; done
          # La caché del service worker se versiona con los estáticos con hash.
          curl --fail --silent http://localhost:8080/sw.js | grep -E '^const PRECACHE = \["/sin-conexion/", "/static/css/[a-z-]+\.[0-9a-f]{12}\.css"'
          curl --fail --silent --show-error http://localhost:8080/sin-conexion/ | grep -c 'Estás sin conexión'
      - name: Comprobar que la aplicación puede guardar fotos y nginx servirlas
        run: |
          docker compose --env-file .env.docker exec -T web sh -c 'echo prueba > /app/media/prueba-ci.txt'
          curl --fail --silent --show-error http://localhost:8080/media/prueba-ci.txt
      - name: Comprobar la copia de seguridad y su restauración
        run: |
          docker compose --env-file .env.docker exec -T respaldos sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /respaldos/ci.dump'
          docker compose --env-file .env.docker exec -T respaldos sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_restore -h db -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists --no-owner /respaldos/ci.dump'
          curl --fail --silent --show-error http://localhost:8080/health/
      - name: Script de respaldo sin S3 configurado (y con S3 inalcanzable)
        run: |
          set -o pipefail
          dc="docker compose --env-file .env.docker"
          # El servicio respalda al arrancar: se espera a que termine para no escribir los mismos archivos a la vez.
          timeout 120 sh -c "until $dc logs respaldos | grep -q 'Respaldo completo'; do sleep 2; done"
          $dc exec -T respaldos aws --version
          # RESPALDO_S3_BUCKET viene vacío de la plantilla: solo copia local, sin tocar AWS.
          $dc exec -T respaldos sh /respaldo.sh --una-vez | tee salida.txt
          if grep -q S3 salida.txt; then exit 1; fi
          $dc exec -T respaldos sh -c 'pg_restore --list "$(ls -t /respaldos/db-*.dump | head -1)" > /dev/null'
          $dc exec -T respaldos sh -c 'tar -tzf "$(ls -t /respaldos/media-*.tar.gz | head -1)" | grep -q prueba-ci.txt'
          # Con un bucket pero sin credenciales: falla avisando, y la copia local sí queda.
          if $dc exec -T -e RESPALDO_S3_BUCKET=infotrip-ci-inexistente -e AWS_EC2_METADATA_DISABLED=true \
              respaldos sh /respaldo.sh --una-vez 2>&1 | tee salida.txt; then exit 1; fi
          grep -q 'la copia local sí quedó' salida.txt
      - name: Servicio de tareas sin claves (cada tarea se salta limpiamente y queda registrada)
        run: |
          set -o pipefail
          dc="docker compose --env-file .env.docker"
          $dc ps --status running --services | grep -qx tareas
          # El servicio corre su primera ronda al arrancar.
          timeout 120 sh -c "until $dc logs tareas | grep -q 'denue: saltada'; do sleep 2; done"
          # Los pasos de respaldo restauran la base (pg_restore --clean) y pueden borrar ese registro: aquí se corre
          # cada tarea de forma síncrona y se comprueba su propio registro, sin depender de lo que hizo el servicio.
          for tarea in denue fuentes_oficiales; do
            $dc exec -T tareas python manage.py ejecutar_tareas --tarea $tarea | tee salida.txt
            grep -q "$tarea: saltada · Falta" salida.txt
          done
          $dc exec -T tareas python manage.py shell -c "
          from apps.datos.models import EjecucionTarea as E
          ultimas = {t: E.objects.filter(tarea=t).first() for t in ('denue', 'fuentes_oficiales')}
          assert all(r and r.resultado == 'saltada' and r.fin for r in ultimas.values()), list(E.objects.values())
          assert not E.objects.filter(resultado='error').exists(), list(E.objects.values())
          "
          if $dc logs tareas | grep -q Traceback; then exit 1; fi
          $dc ps --status running --services | grep -qx tareas
      - name: Comprobar la protección CSRF de la sesión a través de nginx
        run: |
          token=csrfprueba0123456789abcdef012345
          origen=http://localhost:8080
          ruta=$origen/api/v1/auth/logout/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $ruta)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Cookie: csrftoken=$token" -H "X-CSRFToken: $token" -H "Origin: https://ajeno.example" $ruta)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Cookie: csrftoken=$token" -H "X-CSRFToken: $token" -H "Origin: $origen" $ruta)" = 400
      - name: Registros si algo falló
        if: failure()
        run: docker compose --env-file .env.docker logs --no-color
      - name: Apagar
        if: always()
        run: docker compose --env-file .env.docker down --volumes

  despliegue-aws:
    name: Despliegue de AWS con HTTPS (Caddy)
    runs-on: ubuntu-latest
    env:
      DC: docker compose -f docker-compose.yml -f docker-compose.aws.yml --env-file .env.docker
    steps:
      - uses: actions/checkout@v4
      - name: Configuración de prueba con la plantilla de AWS (dominio localhost, valores aleatorios)
        run: |
          clave=$(python3 -c "import secrets; print(secrets.token_urlsafe(60))")
          contrasena=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          sed -e "s|^DOMINIO=.*|DOMINIO=localhost|" -e "s|^ALLOWED_HOSTS=.*|ALLOWED_HOSTS=localhost|" \
              -e "s|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=https://localhost|" \
              -e "s|^SECRET_KEY=.*|SECRET_KEY=$clave|" \
              -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$contrasena|" \
              -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$contrasena|" \
              -e "s|^EMAIL_BACKEND=.*|EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend|" \
              .env.docker.aws.example > .env.docker
          echo "TAREAS_PROGRAMADAS=denue" >> .env.docker
      - name: Construir y levantar con Caddy
        run: $DC up --build --detach --wait --wait-timeout 180
      - name: HTTPS, redirección y cabeceras
        run: |
          curl --fail --silent --show-error --insecure --retry 10 --retry-delay 3 --retry-all-errors https://localhost/health/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 308
          curl --fail --silent --insecure --head https://localhost/ | grep -i '^strict-transport-security'
          curl --fail --silent --show-error --insecure --output /dev/null https://localhost/destinos/
      - name: www lleva al dominio principal
        run: |
          www=$(curl -sk --resolve www.localhost:443:127.0.0.1 -o /dev/null -w '%{http_code} %{redirect_url}' \
            'https://www.localhost/destinos/?q=1')
          test "$www" = "301 https://localhost/destinos/?q=1"
      - name: nginx no queda expuesto y la IP no se puede falsear
        run: |
          ! curl --silent --max-time 5 http://localhost:8080/health/
          # El planeador acepta 10 peticiones por minuto por IP: con X-Forwarded-For inventadas debe frenar igual.
          for i in $(seq 1 11); do
            codigo=$(curl -sk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -H "X-Forwarded-For: 10.0.0.$i" -d '{}' https://localhost/api/v1/rutas/planear/)
          done
          test "$codigo" = 429
      - name: CSRF de la sesión por HTTPS
        run: |
          token=csrfprueba0123456789abcdef012345
          ruta=https://localhost/api/v1/auth/logout/
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H "Cookie: csrftoken=$token" -H "X-CSRFToken: $token" -H "Origin: https://ajeno.example" $ruta)" = 403
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST -H "Cookie: csrftoken=$token" -H "X-CSRFToken: $token" -H "Origin: https://localhost" -H "Referer: https://localhost/" $ruta)" = 400
      - name: Registros si algo falló
        if: failure()
        run: $DC logs --no-color
      - name: Apagar
        if: always()
        run: $DC down --volumes
